# Pipeline de transfer-service: pruebas → imagen en GHCR → despliegue en Railway.
#
# Usa el workflow reutilizable de banklite-pipelines (ver su README). En pull
# requests solo corren las pruebas; en main además se sube la imagen a GHCR
# (etiquetada con el SHA) y se despliega en Railway con `railway up`.
# El autodeploy de Railway desde este repositorio está desconectado: solo
# despliega este workflow.

name: Despliegue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: Luisortiz2406/banklite-pipelines/.github/workflows/servicio.yml@v1
    with:
      servicio: transfer-service
      umbral-lineas: 43
      umbral-ramas: 40
    secrets: inherit
